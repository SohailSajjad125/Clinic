# Local development database only. Do NOT use these settings in production:
# use a managed PostgreSQL with TLS, encryption at rest, a non-superuser application role and automated backups.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clinicos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or a .env file next to this file}
      POSTGRES_DB: clinicos
    ports: ["127.0.0.1:5432:5432"]      # reachable from this machine only, never the network
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
volumes:
  pgdata:
